# مسؤولية الملف: نشر اللعبة على GitHub Pages تلقائيًا مع كل رفع إلى main — بعد نجاح فحص الأنواع والاختبارات
# File responsibility: auto-deploy the game to GitHub Pages on every push to main — after type checks and tests pass

name: نشر اللعبة

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة، والأحدث يلغي الأقدم / One deployment at a time; the newest cancels older ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
